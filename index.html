  width: 100%;
  height: auto;
  transition: transform 0.5s ease;
  transform-origin: center center;
}

.image-zoom-in:hover img {
  transform: scale(1.1);  /* zoom-in andar se */

.image-zoom-out {

  display: inline-block;

  width: 100%;

}
